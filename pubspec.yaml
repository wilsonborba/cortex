name: cortex
description: Cortex chat workspace for Flutter web.
publish_to: none
version: 2.0.1+1
environment:
  sdk: ^3.11.1
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.1.2
  markdown: ^7.3.1
  web: ^1.0.0
  encrypt: ^5.0.3
  url_launcher: ^6.3.1
  go_router: any
  fetch_client: any
  flutter_markdown_plus: any
  fl_chart: any
  flutter_svg: any
  syntax_highlight: ^0.5.0
  graphview: ^1.5.1
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  generate: true
  assets:
    - lib/presentation/frontend/assets/img/
    - lib/presentation/frontend/assets/snippets/
  uses-material-design: true
  fonts:
    - family: Ubuntu Sans
      fonts:
        - asset: lib/presentation/frontend/assets/fonts/UbuntuSans-Variable.ttf
    - family: Ubuntu Sans Mono
      fonts:
        - asset: lib/presentation/frontend/assets/fonts/UbuntuSansMono-Variable.ttf
    - family: IBM Plex Sans Thai
      fonts:
        - asset: lib/presentation/frontend/assets/fonts/IBMPlexSansThai-Regular.ttf
        - asset: lib/presentation/frontend/assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: lib/presentation/frontend/assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
